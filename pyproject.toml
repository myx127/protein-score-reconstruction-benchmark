[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-score-reconstruction-benchmark"
version = "1.0.0"
description = "Fixed protein-network score reconstruction under structured feature missingness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Xinyue Wang"}, {name = "Yuxi Mao"}, {name = "Yan Zeng"}]
dependencies = ["numpy>=1.26,<2", "pandas>=2.1,<2.2", "scipy>=1.10,<1.18", "scikit-learn>=1.2.2,<1.3", "threadpoolctl>=3", "matplotlib>=3.8,<4", "psutil>=5.9"]

[project.scripts]
psbench = "psbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
